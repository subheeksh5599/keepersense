<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" fill="none">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#18181B" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="900" fill="#EBEBE8"/>
  <rect width="720" height="900" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="60" y="48" width="600" height="240" stroke="#18181B" stroke-width="1.5"/>
  <path d="M60 96 H660" stroke="#18181B" stroke-width="1.5"/>
  <circle cx="84" cy="72" r="4" fill="#18181B"/>
  <circle cx="104" cy="72" r="4" fill="#18181B"/>
  <circle cx="124" cy="72" r="4" fill="#18181B"/>
  <text x="640" y="77" text-anchor="end" font-family="monospace" font-size="12" fill="#71717A">mcp_server · 8765</text>

  <text x="84" y="140" font-family="monospace" font-size="13" fill="#18181B">&gt; ks_discover("protect my vault")</text>
  <text x="84" y="168" font-family="monospace" font-size="13" fill="#71717A">  top_match: Aave V3 Liquidation Guard</text>
  <text x="84" y="196" font-family="monospace" font-size="13" fill="#71717A">  score: 8.50 · chain: sepolia</text>
  <text x="84" y="232" font-family="monospace" font-size="13" fill="#18181B">&gt; ks_execute(wf_8f2a…, input: {...})</text>
  <text x="84" y="260" font-family="monospace" font-size="13" fill="#71717A">  tx: 0x9f3a…c41e ✓</text>

  <!-- pipeline nodes -->
  <g font-family="monospace" font-size="12" fill="#18181B">
    <rect x="60" y="380" width="600" height="64" stroke="#18181B" stroke-width="1.5"/>
    <text x="84" y="408" font-size="10" fill="#71717A" letter-spacing="2">01 · DISCOVER</text>
    <text x="84" y="428" font-size="12">GET /api/workflows/public → ranked</text>

    <rect x="60" y="464" width="600" height="64" stroke="#18181B" stroke-width="1.5"/>
    <text x="84" y="492" font-size="10" fill="#71717A" letter-spacing="2">02 · CONFIGURE</text>
    <text x="84" y="512" font-size="12">inputSchema → defaults + required</text>

    <rect x="60" y="548" width="600" height="64" stroke="#18181B" stroke-width="1.5"/>
    <text x="84" y="576" font-size="10" fill="#71717A" letter-spacing="2">03 · DEPLOY</text>
    <text x="84" y="596" font-size="12">POST /workflows/{id}/duplicate</text>

    <rect x="60" y="632" width="600" height="64" stroke="#18181B" stroke-width="1.5"/>
    <text x="84" y="660" font-size="10" fill="#71717A" letter-spacing="2">04 · EXECUTE</text>
    <text x="84" y="680" font-size="12">trigger → poll → retry → tx hash</text>

    <rect x="60" y="716" width="600" height="64" stroke="#18181B" stroke-width="1.5"/>
    <text x="84" y="744" font-size="10" fill="#71717A" letter-spacing="2">05 · AUDIT</text>
    <text x="84" y="764" font-size="12">status + logs · full audit trail</text>
  </g>

  <!-- connectors -->
  <g stroke="#18181B" stroke-width="1">
    <path d="M360 380 V464"/>
    <path d="M360 464 V548"/>
    <path d="M360 548 V632"/>
    <path d="M360 632 V716"/>
  </g>

  <text x="60" y="852" font-family="monospace" font-size="11" fill="#71717A">KEEPERHUB API · app.keeperhub.com/api</text>
  <text x="660" y="852" text-anchor="end" font-family="monospace" font-size="11" fill="#71717A">SEPOLIA</text>
</svg>
